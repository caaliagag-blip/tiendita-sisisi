<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro | Level-Up Gamer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../pagina/styles.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="logo">
      <h1>LEVEL-UP <span>GAMER</span></h1>
    </div>
    <nav>
      <ul>
        <li><a href="../pagina/index.html" id="home-link">Inicio</a></li>
        <li><a href="../pagina/index.html#catalogo">Catálogo</a></li>
        <li><a href="../pagina/index.html#comunidad">Comunidad</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <section id="registro" class="card-section">
      <h2>Registro de Usuario</h2>
      <p class="subtitle">
        Regístrate con tu correo <strong>@duocuc.cl</strong> o <strong>@profesor.duoc.cl</strong> 
        para obtener un <strong>20% de descuento de por vida</strong>.
      </p>

      <form id="register-form">
        <div class="form-group">
          <label for="reg-name">Nombre Completo:</label>
          <input type="text" id="reg-name" placeholder="Tu nombre gamer" required>
        </div>

        <div class="form-group">
          <label for="reg-email">Correo Electrónico:</label>
          <input type="email" id="reg-email" placeholder="ejemplo@duocuc.cl" required>
        </div>

        <div class="form-group">
          <label for="reg-dob">Fecha de Nacimiento:</label>
          <input type="date" id="reg-dob" required>
        </div>

        <div class="form-group">
          <label for="reg-discount">Código de Descuento (Opcional):</label>
          <input type="text" id="reg-discount" placeholder="Ej: DESC2026">
        </div>

        <button type="submit" class="btn btn-accent">Registrarse</button>
      </form>

      <div id="register-message" class="message"></div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Level-Up Gamer.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
